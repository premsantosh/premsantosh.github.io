<svg viewBox="0 0 760 300" role="img" aria-label="One request passes through the confirmation gate, then fans out to a reservation platform, a web form, a phone call, or email, and reports back to your calendar and Signal">
  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
  <g font-family="'Space Grotesk', sans-serif" text-anchor="middle">
    <!-- ask -->
    <rect x="230" y="8" width="300" height="44" rx="10" fill="#fff" stroke="#5b21b6" stroke-width="2"/>
    <text x="380" y="35" font-size="12.5" fill="#0f0f1a">You ask Friday, in plain English</text>

    <!-- gate -->
    <rect x="120" y="72" width="520" height="44" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
    <text x="380" y="99" font-size="12.5" fill="#0f0f1a" font-weight="700">The confirmation gate: nothing books without your explicit &ldquo;yes&rdquo;</text>

    <!-- channels container -->
    <rect x="24" y="156" width="712" height="70" rx="12" fill="#faf9ff" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g font-size="12" fill="#0f0f1a">
      <rect x="34"  y="170" width="160" height="42" rx="9" fill="#fff" stroke="#5b21b6" stroke-width="2"/>
      <text x="114" y="189">Reservations</text>
      <text x="114" y="203" font-size="8" fill="#71717a">(e.g. Tock, OpenTable, Resy)</text>
      <rect x="211" y="170" width="160" height="42" rx="9" fill="#fff" stroke="#4ade80" stroke-width="2"/>
      <text x="291" y="196">Web form</text>
      <rect x="388" y="170" width="160" height="42" rx="9" fill="#fff" stroke="#f97316" stroke-width="2"/>
      <text x="468" y="196">Phone call</text>
      <rect x="565" y="170" width="160" height="42" rx="9" fill="#fff" stroke="#06b6d4" stroke-width="2"/>
      <text x="645" y="196">Email</text>
    </g>

    <!-- report -->
    <rect x="170" y="256" width="420" height="40" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <text x="380" y="281" font-size="12" fill="#0f0f1a">Booked &rarr; calendar event + Signal confirmation</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah2)">
    <line x1="380" y1="52"  x2="380" y2="70"/>
    <line x1="380" y1="116" x2="380" y2="154"/>
    <line x1="380" y1="226" x2="380" y2="254"/>
  </g>
</svg>
