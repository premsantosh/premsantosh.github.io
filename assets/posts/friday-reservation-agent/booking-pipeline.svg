<svg viewBox="0 0 784 104" role="img" aria-label="Six-stage booking pipeline: understand, fill gaps, find channel, confirm, book, report">
  <defs>
    <marker id="ah1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
  <!-- boxes -->
  <g font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#0f0f1a" text-anchor="middle">
    <rect x="8"   y="26" width="100" height="54" rx="10" fill="#fff" stroke="#06b6d4" stroke-width="2"/>
    <text x="58"  y="50">Understand</text><text x="58"  y="66">the ask</text>

    <rect x="136" y="26" width="100" height="54" rx="10" fill="#fff" stroke="#06b6d4" stroke-width="2"/>
    <text x="186" y="50">Fill in</text><text x="186" y="66">the gaps</text>

    <rect x="264" y="26" width="100" height="54" rx="10" fill="#fff" stroke="#5b21b6" stroke-width="2"/>
    <text x="314" y="50">Find how</text><text x="314" y="66">they book</text>

    <rect x="392" y="26" width="100" height="54" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
    <text x="442" y="50" font-weight="700">Confirm</text><text x="442" y="66" font-weight="700">with you</text>

    <rect x="520" y="26" width="100" height="54" rx="10" fill="#fff" stroke="#4ade80" stroke-width="2"/>
    <text x="570" y="50">Book it</text><text x="570" y="66">for real</text>

    <rect x="648" y="26" width="100" height="54" rx="10" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="698" y="50">Tell you</text><text x="698" y="66">it's done</text>
  </g>
  <!-- arrows -->
  <g stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah1)">
    <line x1="110" y1="53" x2="132" y2="53"/>
    <line x1="238" y1="53" x2="260" y2="53"/>
    <line x1="366" y1="53" x2="388" y2="53"/>
    <line x1="494" y1="53" x2="516" y2="53"/>
    <line x1="622" y1="53" x2="644" y2="53"/>
  </g>
</svg>
